<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Demo — Obscuron AI Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 20px; text-align: center; padding: 40px 20px; }
  .logo { font-size: 1.6rem; font-weight: 700; color: #6c5fff; letter-spacing: 0.05em; }
  .msg { color: #aaa; font-size: 1rem; max-width: 420px; line-height: 1.7; }
  .arrow { font-size: 2rem; animation: bounce 1.5s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(8px)} }
  .cta { background: linear-gradient(135deg, #6c5fff, #ff6b9d); color: #fff; padding: 14px 36px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 1rem; margin-top: 10px; display: inline-block; }
  .cta:hover { opacity: 0.9; }
  .biz-name { color: #fff; font-size: 1.1rem; font-weight: 600; }
</style>
</head>
<body>
  <div class="logo">Obscuron AI Chat</div>
  <p class="biz-name" id="biz-title"></p>
  <p class="msg">Your AI chatbot is live and running in the bottom right corner.<br>Click the chat icon to try it out!</p>
  <div class="arrow">↘</div>
  <a href="https://aichat.obscuronlabs.com" class="cta">Get This For Your Website →</a>

  <script>
    var params = new URLSearchParams(window.location.search);
    var config = params.get('config');
    if (config) {
      try {
        var data = JSON.parse(atob(config));
        if (data.n) document.getElementById('biz-title').textContent = data.n;
      } catch(e) {}
      window._ob_config = config;
      var s = document.createElement('script');
      s.src = 'https://aichat.obscuronlabs.com/widget.js';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
