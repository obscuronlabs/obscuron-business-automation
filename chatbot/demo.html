<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Demo — Obscuron AI Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 16px; text-align: center; padding: 40px 20px; }
  .logo { font-size: 1.6rem; font-weight: 700; color: #6c5fff; letter-spacing: 0.05em; }
  .biz-name { color: #fff; font-size: 1.2rem; font-weight: 700; }
  .msg { color: #aaa; font-size: 0.95rem; max-width: 380px; line-height: 1.7; }
  .pulse-hint { display: flex; align-items: center; gap: 10px; background: #1a1a2e; border: 1px solid #6c5fff55; border-radius: 50px; padding: 12px 24px; margin-top: 8px; }
  .pulse { width: 12px; height: 12px; background: #6c5fff; border-radius: 50%; animation: pulse 1.5s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:0.6} }
  .hint-text { font-size: 0.9rem; color: #a78bfa; font-weight: 600; }
  .footer-link { margin-top: 32px; color: #333; font-size: 0.8rem; }
  .footer-link a { color: #6c5fff; text-decoration: none; }
</style>
</head>
<body>
  <div class="logo">Obscuron AI Chat</div>
  <p class="biz-name" id="biz-title"></p>
  <p class="msg">Your AI chatbot is live! The chat window has opened automatically — try it out.</p>
  <div class="pulse-hint">
    <div class="pulse"></div>
    <span class="hint-text">AI Assistant is online and ready</span>
  </div>
  <p class="footer-link">Want this for your website? <a href="https://aichat.obscuronlabs.com">Get started free →</a></p>

  <script>
    var params = new URLSearchParams(window.location.search);
    var config = params.get('config');
    if (config) {
      try {
        var data = JSON.parse(decodeURIComponent(escape(atob(config))));
        if (data.n) document.getElementById('biz-title').textContent = data.n;
      } catch(e) {}
      window._ob_config = config;
      var s = document.createElement('script');
      s.src = 'https://aichat.obscuronlabs.com/widget.js';
      s.onload = function() {
        // Auto-open the chat window after widget loads
        setTimeout(function() {
          var btn = document.getElementById('_ob_btn');
          if (btn) btn.click();
        }, 600);
      };
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
